}

function copySystemsNote() {
    compileFromSystems();
    const noteText = document.getElementById('textView').textContent;
    navigator.clipboard.writeText(noteText).then(() => {
        showStatus('✅ Note copied to clipboard!', 'success');
        showSystemsView();
    }).catch(() => {
        showStatus('❌ Failed to copy note', 'error');
        showSystemsView();
    });
}

function loadPriorNoteIntoSystems() {
    const priorText = document.getElementById('existingNote').value.trim();
    if (!priorText) { showStatus('Paste a prior note in the "Existing Note" box first!', 'error'); return; }

    const s = parseExistingNote(priorText);

    function setField(id, value) {
        if (!value) return;
        const el = document.getElementById(id);
        if (el) el.innerText = value;
    }

    setField('sys-neuro-dx',   s?.NEURO?.dx);
    setField('sys-neuro-exam', s?.NEURO?.exam);
    setField('sys-neuro-plan', s?.NEURO?.plan);
    if (s?.NEURO?.meds)        setField('sys-neuro-meds', s.NEURO.meds);

    setField('sys-pulm-dx',   s?.PULM?.dx);
    setField('sys-pulm-exam', s?.PULM?.exam);
    setField('sys-pulm-o2',   s?.PULM?.o2method);
    setField('sys-pulm-plan', s?.PULM?.plan);
    if (s?.PULM?.meds)        setField('sys-pulm-meds', s.PULM.meds);

    setField('sys-cv-dx',     s?.CV?.dx);
    setField('sys-cv-exam',   s?.CV?.exam);
    setField('sys-cv-access', s?.CV?.access);
    setField('sys-cv-plan',   s?.CV?.plan);
    if (s?.CV?.meds)          setField('sys-cv-meds', s.CV.meds);

    setField('sys-gi-dx',        s?.GI?.dx);
    setField('sys-gi-exam',      s?.GI?.exam);
    setField('sys-gi-nutrition', s?.GI?.nutrition);
    setField('sys-gi-plan',      s?.GI?.plan);
    if (s?.GI?.meds)             setField('sys-gi-ppx', s.GI.meds);
    if (s?.GI?.bowel)            setField('sys-gi-bowel', s.GI.bowel);

    setField('sys-renal-dx',   s?.['RENAL/FLUIDS']?.dx);
    setField('sys-renal-plan', s?.['RENAL/FLUIDS']?.plan);
    if (s?.['RENAL/FLUIDS']?.meds) setField('sys-renal-meds', s['RENAL/FLUIDS'].meds);

    setField('sys-heme-dx',   s?.HEME?.dx);
    setField('sys-heme-labs', s?.HEME?.labs);
    setField('sys-heme-plan', s?.HEME?.plan);
    if (s?.HEME?.meds)        setField('sys-heme-meds', s.HEME.meds);

    setField('sys-inf-dx',   s?.INFECTION?.dx);
    setField('sys-inf-cx',   s?.INFECTION?.cx);
    setField('sys-inf-plan', s?.INFECTION?.plan);
    if (s?.INFECTION?.meds)  setField('sys-inf-meds', s.INFECTION.meds);

    setField('sys-endo-dx',   s?.ENDO?.dx);
    setField('sys-endo-plan', s?.ENDO?.plan);
    if (s?.ENDO?.meds)        setField('sys-endo-meds', s.ENDO.meds);

    setField('sys-misc-dx',   s?.['SKIN/MISC']?.dx);
    setField('sys-misc-plan', s?.['SKIN/MISC']?.plan);
    if (s?.['SKIN/MISC']?.meds) setField('sys-misc-meds', s['SKIN/MISC'].meds);

    setField('sys-dispo-content', s?.['DISPO/PT']?.content);

    showStatus('✅ Prior note fields loaded into Systems cards!', 'success');
}

// ===== UTILITY =====

function showStatus(message, type) {
    const statusEl = document.getElementById('statusMessage');
    statusEl.textContent = message;
    statusEl.className = 'status-message show ' + type;
    setTimeout(() => statusEl.classList.remove('show'), 5000);
}

function copyNote() {
    const noteText = document.getElementById('textView').textContent;
    navigator.clipboard.writeText(noteText).then(() => {
        showStatus('✅ Note copied to clipboard!', 'success');
    }).catch(err => {
        console.error(err);
        showStatus('❌ Failed to copy note', 'error');
    });
}

function downloadNote() {
    const noteText = document.getElementById('textView').textContent;
    const timestamp = new Date().toISOString().split('T')[0];
    const blob = new Blob([noteText], { type: 'text/plain' });
    const url = window.URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `ICU_Note_${timestamp}.txt`;
    link.click();
    window.URL.revokeObjectURL(url);
    showStatus('✅ Note downloaded!', 'success');
}

function clearAll() {
    document.getElementById('violinInput').value = '';
    document.getElementById('existingNote').value = '';
    document.getElementById('outputSection').style.display = 'none';
    showStatus('🗑️ All fields cleared', 'success');
}
